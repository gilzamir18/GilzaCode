<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GilzaCode</title>
<!-- Phase-1 placeholder: proves the window, the session boundary and the API.
     Replaced by the built interface (gui/) in phase 2. -->
<style>
  :root { color-scheme: dark; --bg: #0f1117; --fg: #e6e6e6; --muted: #8b93a7; --ok: #4ade80; --bad: #f87171; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 "Segoe UI", system-ui, sans-serif; }
  main { max-width: 760px; margin: 48px auto; padding: 0 16px; }
  h1 { font-weight: 600; margin: 0 0 4px; }
  p.muted { color: var(--muted); margin: 0 0 24px; }
  li { margin: 4px 0; }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
  code { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>GilzaCode</h1>
  <p class="muted">Phase 1 shell. The interface arrives in phase 2.</p>
  <ul id="checks"></ul>
  <h2>Projects</h2>
  <ul id="projects"><li class="muted">Loading…</li></ul>
</main>
<script>
  const checks = document.getElementById('checks');
  const report = (label, ok, detail = '') => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="${ok ? 'ok' : 'bad'}">${ok ? '✓' : '✗'}</span> ${label} <code></code>`;
    li.querySelector('code').textContent = detail;
    checks.appendChild(li);
  };
  (async () => {
    const boot = await fetch('/api/session', { method: 'POST', headers: { 'X-GilzaCode-Bootstrap': '1' } });
    report('session bootstrap', boot.ok, String(boot.status));
    const env = await fetch('/api/app/environment').then(r => r.json()).catch(e => ({ error: String(e) }));
    report('API reachable', !env.error, env.error || `${env.platform} · v${env.version}`);
    const list = document.getElementById('projects');
    const data = await fetch('/api/projects/list').then(r => r.json());
    list.innerHTML = '';
    if (!data.projects || !data.projects.length) {
      list.innerHTML = '<li class="muted">No projects yet.</li>';
    }
    for (const p of data.projects || []) {
      const li = document.createElement('li');
      li.textContent = `${p.project_name} — ${p.project_path}${p.exists ? '' : ' (missing)'}`;
      list.appendChild(li);
    }
  })().catch(e => report('startup', false, String(e)));
</script>
</body>
</html>
