[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gilzacode"
version = "0.1.4"
description = "A desktop reading and writing workspace (PDF, LaTeX, Markdown) driven by Claude Code."
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14",
    "pillow>=13.0",
    "pymupdf>=1.24.0",
    "onnxruntime>=1.18",
    "numpy>=1.26",
    "pywebview>=6.2; sys_platform == 'win32'",
    "pywinpty>=3.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=9.2", "pytest-aiohttp>=1.1"]

[project.scripts]
gilzacode = "gilzacode.__main__:main"
gilzacode-mcp = "gilzacode.mcp_bridge:main"

[tool.setuptools.packages.find]
include = ["gilzacode*"]

[tool.setuptools.package-data]
gilzacode = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
