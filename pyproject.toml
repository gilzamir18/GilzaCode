[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gilzacode"
version = "0.1.8"
description = "A desktop reading and writing workspace (PDF, LaTeX, Markdown) driven by Claude Code."
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14",
    "pillow>=13.0",
    "pymupdf>=1.24.0",
    "onnxruntime>=1.18",
    "numpy>=1.26",
    "pywebview>=6.2; sys_platform == 'win32'",
    "pywinpty>=3.1; sys_platform == 'win32'",
    # Linux: the window is pywebview's Qt backend with QtWebEngine (PROJECT_DESIGN.md §5).
    # The range is GilzaBots' verified one: Qt 6.8 (Chromium 122) cannot open a
    # PDF (pdf.js calls URL.parse), and the four packages must share one Qt minor,
    # which PyQt6-WebEngine does not enforce on PyQt6-Qt6.
    "pywebview>=6.2; sys_platform == 'linux'",
    "PyQt6>=6.11.0,<6.12; sys_platform == 'linux'",
    "PyQt6-Qt6>=6.11.2,<6.12; sys_platform == 'linux'",
    "PyQt6-WebEngine>=6.11.0,<6.12; sys_platform == 'linux'",
    "PyQt6-WebEngine-Qt6>=6.11.2,<6.12; sys_platform == 'linux'",
    "qtpy>=2.4; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = ["pytest>=9.2", "pytest-aiohttp>=1.1"]

[project.scripts]
gilzacode = "gilzacode.__main__:main"
gilzacode-mcp = "gilzacode.mcp_bridge:main"

[tool.setuptools.packages.find]
include = ["gilzacode*"]

[tool.setuptools.package-data]
gilzacode = ["static/**/*", "window/GilzaCode.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
